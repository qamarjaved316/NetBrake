name: Release

# 打 tag 即发布：推送 v 开头的 tag（如 v1.0.3）会构建 release APK
# 并创建同名 GitHub Release，把 APK 作为附件上传。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # 可选的正式签名：仓库配置了 KEYSTORE_BASE64 等 secrets 时启用，
      # 否则回退到 debug 签名（与本地构建一致）。
      # 注意：debug 签名的 keystore 每次 CI 运行都会重新生成，各次 release
      # 的签名互不相同，用户无法覆盖安装升级——需要可升级的正式包请配置 secrets。
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "使用仓库配置的正式签名"
          else
            echo "未配置 KEYSTORE_BASE64，回退到 debug 签名"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/NetBrake-${GITHUB_REF_NAME}.apk"
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/NetBrake-${GITHUB_REF_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "NetBrake ${GITHUB_REF_NAME}" \
              --generate-notes \
              "$APK"
          fi
