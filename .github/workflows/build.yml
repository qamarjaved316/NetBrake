name: Build

# 日常自测包：push / PR 即构建 debug APK 并作为 artifact 上传，
# 下载安装自测通过后，再打 v 开头的 tag 走 release.yml 正式发布。
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # 构建标识 = run 号 + commit 短 sha，同时写进 APK 版本名和文件名，
      # 拿到包就能对上是哪一次构建。
      # PR 事件 checkout 的是临时的 merge commit，HEAD 在 PR 里找不到，
      # 所以优先取 PR 源分支的 commit。
      - name: Resolve build tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "value=${GITHUB_RUN_NUMBER}-$(echo "$HEAD_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug -PbuildTag=${{ steps.tag.outputs.value }} --no-daemon --stacktrace

      - name: Stage APK
        id: stage
        run: |
          NAME="NetBrake-debug-${{ steps.tag.outputs.value }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
