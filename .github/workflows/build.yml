name: Build

# 日常自测包：push / PR 即构建 debug + release APK 并作为 artifact 上传，
# 下载安装自测通过后，再打 v 开头的 tag 走 release.yml 正式发布。
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  test-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # 构建标识 = run 号 + commit 短 sha，同时写进 APK 版本名和文件名，
      # 拿到包就能对上是哪一次构建。
      # PR 事件 checkout 的是临时的 merge commit，HEAD 在 PR 里找不到，
      # 所以优先取 PR 源分支的 commit。
      - name: Resolve build tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "value=${GITHUB_RUN_NUMBER}-$(echo "$HEAD_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # release 自测包的签名规则与 release.yml 一致：配了 secrets 用正式签名，
      # 否则回退 debug 签名。fork 来的 PR 拿不到 secrets，同样走回退分支。
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "使用仓库配置的正式签名"
          else
            echo "未配置 KEYSTORE_BASE64，回退到 debug 签名"
          fi

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug assembleRelease \
            -PbuildTag=${{ steps.tag.outputs.value }} --no-daemon --stacktrace

      - name: Stage APKs
        id: stage
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/NetBrake-debug-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/NetBrake-release-${TAG}.apk"
          echo "name=NetBrake-${TAG}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
