plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.netbrake.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.netbrake.app"
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName "1.0.4"
    }

    signingConfigs {
        // 正式签名：仅当环境变量 KEYSTORE_FILE 存在时才配置（CI 由 secrets 注入）。
        // 未配置时 release 会回退到 debug 签名，本地构建行为不变。
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // 测试包的版本名带上构建标识：CI 注入「run 号-commit」，本地构建标记为 local。
            // 否则每个自测包都叫 1.0.4，装到机器上分不清是哪一次构建。
            versionNameSuffix "-" + (project.findProperty('buildTag') ?: 'local')
        }
        release {
            minifyEnabled false
            // 有正式签名就用正式签名，否则用 debug 签名方便直接安装。
            // 注意：debug keystore 由 AGP 自动生成，不同机器/不同 CI 运行各不相同，
            // 想让用户能覆盖安装升级就必须配置正式签名。
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
